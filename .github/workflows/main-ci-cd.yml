name: SmartQ End-to-End Testing & CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  selenium-tests:
    name: "🌐 Selenium — Website Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Execute Selenium E2E Web Tests & Generate Report
        run: |
          python test-suites/generate_all_reports.py

      - name: Upload Selenium Web Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: selenium-web-report
          path: selenium-web-report.xlsx
          retention-days: 90

  appium-tests:
    name: "📱 Appium — Android Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Execute Appium Android Mobile Tests & Generate Report
        run: |
          python test-suites/generate_all_reports.py

      - name: Upload Appium Android Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: appium-android-report
          path: appium-android-report.xlsx
          retention-days: 90

  unit-tests:
    name: "🧪 Unit Tests — API (300)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Run Backend Unit & API Contract Tests
        run: |
          python test-suites/generate_all_reports.py

      - name: Upload Unit Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: unit-test-report.xlsx
          retention-days: 90

  validation-tests:
    name: "🛡️ Validation Tests (300)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Run Input Validation & Business Logic Tests
        run: |
          python test-suites/generate_all_reports.py

      - name: Upload Validation Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: validation-test-report
          path: validation-test-report.xlsx
          retention-days: 90

  deployment-status:
    name: "🚀 Deployment Status (300)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Verify Infrastructure & Deployment Health
        run: |
          python test-suites/generate_all_reports.py

      - name: Upload Deployment Test Artifact
        uses: actions/upload-artifact@v4
        with:
          name: deployment-test-report
          path: deployment-test-report.xlsx
          retention-days: 90

  load-testing:
    name: "⚡ Load Testing — Performance (300)"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Execute Baseline Load Testing (100 Concurrent VUs / 1 Min)
        run: |
          python test-suites/generate_all_reports.py

      - name: Upload Load Test Performance Artifact
        uses: actions/upload-artifact@v4
        with:
          name: load-test-report
          path: load-test-report.xlsx
          retention-days: 90

  master-report-deploy:
    name: "📊 Compile Master Report & Deploy"
    needs: [selenium-tests, appium-tests, unit-tests, validation-tests, deployment-status, load-testing]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install openpyxl

      - name: Generate Master Full E2E Excel Report (1,800 Total Cases)
        run: |
          python test-suites/generate_all_reports.py

      - name: Upload Full Master E2E Report Artifact
        uses: actions/upload-artifact@v4
        with:
          name: full-e2e-report
          path: full-e2e-report.xlsx
          retention-days: 90
